name: Wii Modern Media Player Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          for f in Makefile meta.xml icon.png LICENSE README.md README_FA.md tools/apply_wiimc_patch.py tools/build_upstream.sh; do
            test -f "$f"
          done
          grep -Fq '<name>Wii Modern Media Player</name>' meta.xml
          grep -Fq '<no_ios_reload />' meta.xml
          grep -Fq 'MP_CMD_DVDNAV_MOUSECLICK' tools/apply_wiimc_patch.py
          python3 -m py_compile tools/apply_wiimc_patch.py
          PROJECT_VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' meta.xml | head -n1)"
          test -n "$PROJECT_VERSION"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          : "${DEVKITPRO:?}"
          : "${DEVKITPPC:?}"
          export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/ppc/bin:$DEVKITPRO/portlibs/wii/bin:$PATH"
          for f in "$DEVKITPPC/bin/powerpc-eabi-gcc" "$DEVKITPPC/bin/powerpc-eabi-g++" "$DEVKITPRO/tools/bin/elf2dol" "$DEVKITPRO/libogc2/wii_rules"; do
            test -e "$f"
          done
          command -v make git python3 powerpc-eabi-gcc powerpc-eabi-g++ elf2dol

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build_upstream.sh tools/apply_wiimc_patch.py

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/ppc/bin:$DEVKITPRO/portlibs/wii/bin:$PATH"
          make -j2

      - name: Validate DOL and package
        shell: bash
        run: |
          set -euo pipefail
          DIST=dist/apps/WiiModernMediaPlayer
          DOL="$DIST/boot.dol"
          test -s "$DOL"
          test -s "$DIST/meta.xml"
          test -s "$DIST/icon.png"

          python3 - "$DOL" <<'PY'
          import os, struct, sys
          p = sys.argv[1]
          b = open(p, 'rb').read()
          if len(b) < 0x100:
              raise SystemExit(f"ERROR: DOL is too small: {len(b)} bytes")
          # DOL has 7 text + 11 data file-offset/size pairs at 0x00/0x1c.
          pairs = []
          for i in range(18):
              off = struct.unpack('>I', b[i*4:i*4+4])[0]
              size = struct.unpack('>I', b[0x90+i*4:0x90+i*4+4])[0]
              if off and size:
                  if off + size > len(b):
                      raise SystemExit(f"ERROR: invalid DOL section {i}: {off}+{size}>{len(b)}")
                  pairs.append((off, size))
          if not pairs:
              raise SystemExit("ERROR: DOL contains no loadable sections")
          max_end = max(off + size for off, size in pairs)
          if max_end < 0x1000:
              raise SystemExit(f"ERROR: suspiciously tiny DOL: {len(b)} bytes")
          print(f"VALID DOL: {len(b)} bytes, {len(pairs)} sections, payload end {max_end}")
          PY

          PROJECT_VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' meta.xml | head -n1)"
          BUILT_VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' "$DIST/meta.xml" | head -n1)"
          test "$BUILT_VERSION" = "$PROJECT_VERSION"

          mkdir -p artifact
          cp -a "$DIST" artifact/WiiModernMediaPlayer
          cd artifact
          zip -r "../WiiModernMediaPlayer-v${PROJECT_VERSION}-Wii.zip" WiiModernMediaPlayer >/dev/null
          cd ..
          unzip -t "WiiModernMediaPlayer-v${PROJECT_VERSION}-Wii.zip"

      - name: Upload Wii package
        uses: actions/upload-artifact@v4
        with:
          name: WiiModernMediaPlayer-v${{ env.PROJECT_VERSION }}-Wii
          path: WiiModernMediaPlayer-v${{ env.PROJECT_VERSION }}-Wii.zip
          if-no-files-found: error
